<title>Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: dark gym-floor look. One narrow column, floating tab bar, main action docked at thumb height.
   Tiers run cool to hot (t1..t4) so the ladder reads as getting heavier. */
:root{
  --bg:#090c0f; --surface:#11171c; --surface2:#19212a; --surface3:#232d38; --line:#232f3a;
  --fg:#edf2f5; --muted:#8a99a6;
  --accent:#38e1c6; --accent-2:#1fb29b; --on-accent:#03201a;
  --cal:#ffbf5e; --carb:#7eaaff; --fat:#ff8d75; --good:#5fe08e; --danger:#ff6f62;
  --t1:#4fd6c4; --t2:#74b4ff; --t3:#ffbd4a; --t4:#ff6a55;
  --glow:rgba(56,225,198,.11); --hi:rgba(255,255,255,.05); --shadow:rgba(0,0,0,.5); --scrim:rgba(2,5,8,.66);
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav:86px; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#edf1f3; --surface:#ffffff; --surface2:#e6ecef; --surface3:#d9e1e5; --line:#d3dde2;
  --fg:#0e181d; --muted:#52636e;
  --accent:#007f6e; --accent-2:#006a5b; --on-accent:#ffffff;
  --cal:#a35d05; --carb:#2a5ac8; --fat:#bb3f28; --good:#177f45; --danger:#bf352a;
  --t1:#00806f; --t2:#2a62c8; --t3:#a35d05; --t4:#c23d28;
  --glow:rgba(0,127,110,.09); --hi:rgba(255,255,255,.7); --shadow:rgba(20,40,50,.2); --scrim:rgba(10,20,26,.5);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#edf1f3; --surface:#ffffff; --surface2:#e6ecef; --surface3:#d9e1e5; --line:#d3dde2;
  --fg:#0e181d; --muted:#52636e;
  --accent:#007f6e; --accent-2:#006a5b; --on-accent:#ffffff;
  --cal:#a35d05; --carb:#2a5ac8; --fat:#bb3f28; --good:#177f45; --danger:#bf352a;
  --t1:#00806f; --t2:#2a62c8; --t3:#a35d05; --t4:#c23d28;
  --glow:rgba(0,127,110,.09); --hi:rgba(255,255,255,.7); --shadow:rgba(20,40,50,.2); --scrim:rgba(10,20,26,.5);
  color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 46% at 50% -6%,var(--glow),transparent 72%)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--nav) + 118px)}
.enter{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0}to{opacity:1}}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-d);font-weight:800;letter-spacing:.01em}
.label{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.tight{gap:8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:inset 0 1px 0 var(--hi)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:16px;background:var(--surface2);font-weight:600;font-size:17px;width:100%;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{--b:var(--accent);min-height:64px;color:var(--on-accent);font-family:var(--font-d);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;
  background:linear-gradient(180deg,color-mix(in srgb,var(--b) 82%,#fff),var(--b));box-shadow:0 8px 22px -8px var(--b),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:50px;font-size:16px;border-radius:14px}
.link{color:var(--muted);min-height:48px;padding:0 10px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;background:var(--surface2);font-size:14px;font-weight:600;white-space:nowrap}
.tchip{--tc:var(--accent);display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 38%,transparent)}
.iconbtn{width:48px;height:48px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none}
.iconbtn[disabled]{opacity:.3;pointer-events:none}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;margin-bottom:12px}
.top h1{font-family:var(--font-d);font-weight:800;font-size:38px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.top .sub{font-size:14px;color:var(--muted);font-weight:500}

/* Floating tab bar */
.nav{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;padding-inline:12px;pointer-events:none}
.nav-in{pointer-events:auto;max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 12px 30px -10px var(--shadow),inset 0 1px 0 var(--hi)}
.nav button{height:62px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:600}
.nav .ico{width:48px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.nav .ic{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] .ico{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:25;background:linear-gradient(to top,var(--bg) 62%,transparent)}
.dock-in{max-width:560px;margin:0 auto;padding:22px 16px 6px;display:flex;flex-direction:column;gap:6px}

/* Food: protein hero */
.hero{padding:20px 18px 18px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface) 60%);overflow:hidden}
.hero-num{display:flex;align-items:baseline;gap:10px;margin:8px 0 14px}
.hero-num .big{font-family:var(--font-d);font-weight:800;font-size:96px;line-height:.82;color:var(--accent);letter-spacing:-.01em}
.hero-num .of{font-family:var(--font-d);font-weight:700;font-size:30px;color:var(--muted)}
.meter{position:relative;height:28px;border-radius:99px;background:var(--surface2);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.meter>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 18px -2px var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meter::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 24.6%,var(--bg) 24.6% 25.4%,transparent 25.4% 49.6%,var(--bg) 49.6% 50.4%,transparent 50.4% 74.6%,var(--bg) 74.6% 75.4%,transparent 75.4%);opacity:.55}
.meter.done>i{background:linear-gradient(90deg,var(--good),var(--accent))}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--cal);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface2);border-radius:14px;padding:12px 14px}
.tile .v{font-family:var(--font-d);font-weight:800;font-size:34px;line-height:1.05}
.tile .v small{font-size:16px;font-weight:700;margin-left:2px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface2)}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:500}

.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;margin-inline:-16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:56px;padding:8px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;max-width:210px;box-shadow:inset 0 1px 0 var(--hi)}
.chip b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font-size:13px;color:var(--muted)}
.chip em{font-style:normal;color:var(--accent);font-weight:700}

.entry{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 2px;text-align:left;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.avatar{width:46px;height:46px;border-radius:14px;flex:none;object-fit:cover;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:22px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface2))}
.entry .p{font-family:var(--font-d);font-weight:800;font-size:30px;line-height:1;color:var(--accent);text-align:right;min-width:60px}
.entry .p small{font-size:15px;color:var(--muted);margin-left:1px}
.entry .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitag{width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--accent)}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.scrim.pop{animation:fade .2s ease both}
.scrim.pop .sheet{animation:slide .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet{width:100%;max-width:560px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:8px 16px 0;display:flex;flex-direction:column;gap:14px}
.sheet>*{flex:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--surface3);margin:2px auto 0;flex:none}
.sheet-foot{position:sticky;bottom:0;margin-inline:-16px;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;flex-direction:column;gap:8px;flex:none}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.in{width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:18px;transition:border-color .15s}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{padding:12px 14px;min-height:92px;resize:vertical;line-height:1.35}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.src{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.src label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;border-radius:18px;background:var(--surface);border:1.5px dashed var(--surface3);font-weight:600;cursor:pointer}
.src label .ic{width:30px;height:30px;color:var(--accent)}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:16px;display:block}
.mults{display:flex;gap:8px}
.mults button{flex:1;min-height:48px;border-radius:12px;background:var(--surface2);font-weight:700}
.mults button.on{background:var(--accent);color:var(--on-accent)}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--surface3);border-top-color:var(--accent);animation:sp .9s linear infinite;flex:none}
.spin.sm{width:20px;height:20px;border-width:3px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{border:1.5px solid var(--danger);border-radius:14px;padding:12px 14px;color:var(--danger);font-weight:500;font-size:15px}
.note{border-radius:14px;padding:12px 14px;background:var(--surface2);font-size:15px}
.in.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent);border-color:var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.mainmacro{font-family:var(--font-d);font-weight:800;font-size:44px!important;min-height:68px!important;color:var(--accent)}

/* Claude: reasoning + refine */
.why{padding:0;overflow:hidden}
.why-h{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;text-align:left}
.why-h .sp{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface2));flex:none}
.why-h .chev{transition:transform .2s;color:var(--muted)}
.why.open .chev{transform:rotate(180deg)}
.why-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.why-b p{margin:0;font-size:16px;line-height:1.45}
.brk{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.brk .n{font-weight:600}
.brk .pt{font-size:13px;color:var(--muted)}
.brk .v{text-align:right;font-weight:700}
.brk .v small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.brk.tot{border-top:2px solid var(--surface3)}
.brk.tot .v{color:var(--accent)}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.bul li{display:flex;gap:10px}
.bul li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface3);flex:none}
.conf.high{color:var(--good)} .conf.medium{color:var(--cal)} .conf.low{color:var(--danger)}
.thread{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px;font-weight:500}
.bub.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:6px}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface3)}
.dchip.p{color:var(--accent)} .dchip.k{color:var(--cal)} .dchip.c{color:var(--carb)} .dchip.f{color:var(--fat)}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.sugg button{min-height:44px;padding:0 14px;border-radius:99px;background:var(--surface2);font-size:14px;font-weight:600}
.fu{display:flex;gap:8px;align-items:flex-end}
.fu textarea{min-height:56px;flex:1;min-width:0}
.send{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.45;pointer-events:none}
.attach{width:56px;height:56px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;flex:none;cursor:pointer}

/* Workout */
.segs{display:flex;gap:5px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--surface2)}
.segs i.done{background:var(--tc)}
.segs i.now{background:var(--tc);box-shadow:0 0 12px var(--tc);height:10px;margin-top:-1px}
.segs i.skip{background:var(--surface3)}
.badge{--tc:var(--accent);width:76px;height:76px;border-radius:22px;display:grid;place-items:center;flex:none;font-family:var(--font-d);font-weight:800;font-size:46px;line-height:1;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--tc) 42%,transparent);box-shadow:0 8px 24px -10px var(--tc)}
.badge.sm{width:38px;height:38px;border-radius:12px;font-size:22px;box-shadow:none}
.exc{display:flex;flex-direction:column;gap:12px;padding:16px}
.exc h3{font-size:20px;font-weight:600;font-family:var(--font-b)}
.beat{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--cal);white-space:nowrap;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--cal) 13%,transparent)}
.step{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;align-items:center}
.step button{height:62px;border-radius:16px;background:var(--surface2);font-size:30px;font-weight:600;line-height:1}
.step button:active{background:var(--surface3)}
.step .val{position:relative}
.step input{width:100%;height:62px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-family:var(--font-d);font-weight:800;font-size:40px;padding:0 36px 0 0;-moz-appearance:textfield}
.step input:focus{outline:none;border-color:var(--tc,var(--accent))}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);font-weight:700;pointer-events:none}
.lastline{font-size:14px;color:var(--muted)}
.lastline b{color:var(--fg)}
.ladder{position:relative;display:flex;flex-direction:column;gap:14px}
.ladder::before{content:'';position:absolute;left:19px;top:24px;bottom:24px;width:3px;border-radius:2px;background:linear-gradient(var(--t1),var(--t2),var(--t3),var(--t4));opacity:.55}
.rung{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.node{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:3px solid var(--tc);color:var(--tc);font-family:var(--font-d);font-weight:800;font-size:22px;margin-top:10px}
.ssrow{display:flex;gap:12px;align-items:center}
.ring{position:relative;width:250px;height:250px;margin:4px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--tc,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 8px var(--tc,var(--accent)))}
.ring.ready .fg{stroke:var(--good);filter:drop-shadow(0 0 10px var(--good))}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .clock{font-family:var(--font-d);font-weight:800;font-size:82px;line-height:1}
.logged{display:flex;align-items:center;gap:12px}
.tick{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);flex:none}
.tick .ic{width:18px;height:18px;stroke-width:3}

/* History */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{min-height:46px;border-radius:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface3);color:var(--fg)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ============================================================
   Gym Tracker: food + dumbbell ladder. All data stays in this browser.
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dkey(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const num = (v, def = 0) => { const n = parseFloat(v); return isFinite(n) ? n : def; };
const r1 = n => Math.round(n * 10) / 10;
const fmt = n => Math.round(n).toLocaleString();
const mmss = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + pad(sec % 60); };
const shortDate = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const longDate = ts => new Date(ts).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
const wfmt = w => (Math.round(w * 10) / 10).toString();
const ic = (p, cls) => '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
const I = {
  today: '<path d="M7 3v8a3 3 0 0 0 3 3v7M7 3v5M10 3v5M17 3c-2 2-3 5-3 8h3v10"/>',
  workout: '<path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/>',
  history: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  settings: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  left: '<path d="M15 6l-6 6 6 6"/>', right: '<path d="M9 6l6 6-6 6"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
};

/* ---------- Workout definition ---------- */
const TIERS = {
  1: { name: 'Light',    lb: '~10 lb',     w: 10 },
  2: { name: 'Medium',   lb: '~20 lb',     w: 20 },
  3: { name: 'Heavy',    lb: '30–40 lb',   w: 35 },
  4: { name: 'Heaviest', lb: '40–50+ lb',  w: 45 },
};
const EX = {
  lat:  { n: 'Lateral raise', r: 12 },            rear: { n: 'Rear delt fly', r: 12 },
  wc:   { n: 'Wrist curl', r: 15 },               rwc:  { n: 'Reverse wrist curl', r: 15 },
  bic:  { n: 'Bicep curl', r: 10 },               oht:  { n: 'Overhead tricep extension', r: 10 },
  ham:  { n: 'Hammer curl', r: 10 },              sk:   { n: 'Skull crusher', r: 10 },
  fp:   { n: 'Floor press', r: 10 },              row:  { n: 'Bent-over row', r: 10 },
  ohp:  { n: 'Overhead press', r: 10 },          shr:  { n: 'Shrug', r: 12 },
  gob:  { n: 'Goblet squat', r: 10 },             rdl:  { n: 'Romanian deadlift', r: 10 },
  calf: { n: 'Calf raise', r: 15 },
};
const SS = [
  { id: 'A', tier: 1, ex: ['lat', 'rear'] },
  { id: 'B', tier: 1, ex: ['wc', 'rwc'] },
  { id: 'C', tier: 2, ex: ['bic', 'oht'] },
  { id: 'D', tier: 2, ex: ['ham', 'sk'], opt: true },
  { id: 'E', tier: 3, ex: ['fp', 'row'] },
  { id: 'F', tier: 3, ex: ['ohp', 'shr'] },
  { id: 'G', tier: 4, ex: ['gob', 'rdl'] },
  { id: 'FIN', tier: 4, ex: ['calf'], fin: true },
];
const ssLabel = d => d.fin ? 'Finisher' : 'Superset ' + d.id;
const ssIndex = id => SS.findIndex(d => d.id === id);
const tvar = t => 'var(--t' + t + ')';

/* ---------- Storage: Dexie, with an in-memory fallback if IndexedDB is blocked ---------- */
let db, memMode = false;
function makeMem() {
  const mk = (pk, auto) => { let rows = [], n = 0; return {
    async toArray() { return rows.map(r => ({ ...r })); },
    async add(o) { o = { ...o }; if (auto && o[pk] == null) o[pk] = ++n; rows.push(o); return o[pk]; },
    async put(o) { o = { ...o }; if (auto && o[pk] == null) o[pk] = ++n; const i = rows.findIndex(r => r[pk] === o[pk]); if (i >= 0) rows[i] = o; else rows.push(o); return o[pk]; },
    async delete(k) { rows = rows.filter(r => r[pk] !== k); },
    async clear() { rows = []; },
  }; };
  return { foods: mk('id', true), sessions: mk('id', true), settings: mk('key', false) };
}
/* Cloud store: the artifact's private per-viewer database (data/users/<id>/...). Same table API as Dexie. */
let lastId = 0;
const nextId = () => (lastId = Math.max(Date.now(), lastId + 1));
async function makeCloud() {
  const cdb = window.claude && await window.claude.use('db');
  const user = window.claude && await window.claude.use('user');
  if (!cdb || !user) return null;
  const uid = await user.id();
  if (!uid) return null;
  const root = cdb.doc('data/users/' + uid + '/store');
  const clean = o => JSON.parse(JSON.stringify(o));
  const chain = new Map();
  const run = (id, fn) => {
    const prev = chain.get(id) || Promise.resolve();
    const p = prev.catch(() => {}).then(fn);
    chain.set(id, p);
    p.finally(() => { if (chain.get(id) === p) chain.delete(id); }).catch(() => {});
    return p;
  };
  const tbl = name => {
    const col = root.collection(name);
    return {
      async toArray() { const snap = await col.orderBy('ts', 'desc').limit(1000).get(); return snap.docs.map(d => clean(d.data())); },
      add(o) { o = clean(o); if (o.id == null) o.id = nextId(); return run(o.id, () => col.doc(String(o.id)).set(o)).then(() => o.id); },
      put(o) { o = clean(o); if (o.id == null) o.id = nextId(); return run(o.id, () => col.doc(String(o.id)).set(o)).then(() => o.id); },
      delete(id) { return run(id, () => col.doc(String(id)).delete()); },
      async clear() { const snap = await col.limit(1000).get(); await Promise.all(snap.docs.map(d => col.doc(d.id).delete())); },
    };
  };
  const sdoc = cdb.doc('data/users/' + uid + '/settings');
  let sv = null, schain = Promise.resolve();
  const sload = async () => { if (sv) return sv; const s = await sdoc.get(); sv = s.exists ? { ...((s.data() || {}).values || {}) } : {}; return sv; };
  const swrite = () => (schain = schain.catch(() => {}).then(() => sdoc.set({ values: { ...sv } })));
  const settings = {
    async toArray() { const v = await sload(); return Object.entries(v).map(([key, value]) => ({ key, value })); },
    async put(r) { const v = await sload(); v[r.key] = r.value; return swrite(); },
    async clear() { sv = {}; return swrite(); },
    async delete() {},
  };
  const t = { foods: tbl('foods'), sessions: tbl('sessions'), settings };
  await t.foods.toArray();   // fails here if this view can't read its own data, so we fall back
  return t;
}
let store = 'mem';
async function initDb() {
  let local = null;
  try {
    const d = new Dexie('gymtracker');
    d.version(1).stores({ foods: '++id,date,ts', sessions: '++id,ts,status', settings: 'key' });
    await d.open();
    local = d;
  } catch (e) { local = null; }
  let cloud = null;
  try { cloud = await makeCloud(); } catch (e) { cloud = null; }
  if (cloud) { db = cloud; store = 'cloud'; state.localDb = local; }
  else if (local) { db = local; store = 'local'; }
  else { db = makeMem(); store = 'mem'; }
  memMode = store === 'mem';
}
/* Carry over anything saved in this browser by an earlier version, once, into an empty account store. */
async function migrateLocal() {
  const L = state.localDb;
  if (store !== 'cloud' || !L || state.foods.length || state.sessions.length) return;
  const [lf, ls, lset] = await Promise.all([L.foods.toArray(), L.sessions.toArray(), L.settings.toArray()]);
  if (!lf.length && !ls.length) return;
  for (const f of lf) await db.foods.put(f);
  for (const s of ls) await db.sessions.put(s);
  for (const r of lset) await db.settings.put(r);
  await loadAll();
  toast('Moved ' + (lf.length + ls.length) + ' saved items to your account');
}

const DEFAULTS = { proteinGoal: 160, calGoal: 2600, sets: 3, restSec: 60, step: 5 };
const state = {
  tab: 'today', viewDate: todayKey(), foods: [], sessions: [], settings: { ...DEFAULTS },
  sheet: null, add: null, cf: null, active: null, wk: null, enter: false, pop: false,
  hTab: 'sessions', hEx: 'lat', openSess: null, arm: null,
  ai: null, aiImages: null, aiMax: 1, aiReady: false, ctl: null, backupMsg: '', loading: true, localDb: null,
  lastToday: todayKey(), lastLoad: Date.now(),
};

async function safe(fn) { try { return await fn(); } catch (e) { toast(store === 'cloud' ? 'Couldn’t save to your account. Check your connection and try again.' : 'Could not save to this browser'); return null; } }

async function loadAll() {
  state.foods = await db.foods.toArray();
  state.sessions = await db.sessions.toArray();
  const rows = await db.settings.toArray();
  rows.forEach(r => { if (r.key in DEFAULTS) state.settings[r.key] = r.value; });
  state.active = state.sessions.find(s => s.status === 'active') || null;
  state.lastLoad = Date.now();
}
const setSetting = (k, v) => { state.settings[k] = v; return safe(() => db.settings.put({ key: k, value: v })); };
const doneSessions = () => state.sessions.filter(s => s.status === 'done').sort((a, b) => a.ts - b.ts);

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const el = $('#toast');
  el.classList.remove('show'); void el.offsetWidth;
  el.innerHTML = '<div class="t"><span>' + esc(msg) + '</span>' + (undo ? '<button data-act="undo">Undo</button>' : '') + '</div>';
  el.classList.add('show');
  toast.undo = undo;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 2600);
}

/* ============================================================
   Rendering
   ============================================================ */
const app = $('#app');
function captureDraft() {
  const t = $('#addText'); if (t && state.add) state.add.text = t.value;
  if (state.sheet === 'confirm' && state.cf && $('#cfName')) { readCf(); const fu = $('#fuText'); if (fu) state.cf.fu = fu.value; }
}
function render(skipCapture) {
  if (!skipCapture) captureDraft();
  const old = document.querySelector('.sheet'), st = old ? old.scrollTop : 0;
  const views = { today: viewToday, workout: viewWorkout, history: viewHistory, settings: viewSettings };
  const tabs = [['today', 'Food'], ['workout', 'Workout'], ['history', 'History'], ['settings', 'Settings']];
  const enter = state.enter; state.enter = false;
  app.innerHTML = '<div class="' + (enter ? 'enter' : '') + '">' + (state.loading ? '<div class="card row" style="gap:16px;margin-top:30vh"><div class="spin"></div><div><b>Loading your data…</b><div class="small muted">Fetching your saved meals and workouts.</div></div></div>' : views[state.tab]()) + '</div>' +
    '<nav class="nav" aria-label="Sections"><div class="nav-in">' +
    tabs.map(([k, l]) => '<button data-act="nav" data-tab="' + k + '"' + (state.tab === k ? ' aria-current="page"' : '') + '><span class="ico">' + ic(I[k]) + '</span>' + l + '</button>').join('') +
    '</div></nav>' + (state.sheet ? sheetHtml() : '');
  document.body.classList.toggle('lock', !!state.sheet);
  const nu = document.querySelector('.sheet'); if (nu && old && !state.pop) nu.scrollTop = st;
  state.pop = false; if (state.cf) state.cf.flash = null;
}

/* ---------- Food: dashboard ---------- */
const totalsFor = date => state.foods.filter(f => f.date === date).reduce((a, f) => (a.p += f.p, a.cal += f.cal, a.c += f.c, a.f += f.f, a), { p: 0, cal: 0, c: 0, f: 0 });
const timeOf = ts => new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

function viewToday() {
  const d = state.viewDate, isToday = d === todayKey(), S = state.settings;
  const list = state.foods.filter(f => f.date === d).sort((a, b) => a.ts - b.ts);
  const t = totalsFor(d);
  const pg = S.proteinGoal, left = Math.round(pg - t.p), pct = Math.round(t.p / pg * 100);
  const dateLabel = isToday ? 'Today' : parseKey(d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const sub = isToday ? parseKey(d).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) : '';
  const seen = new Set(), recents = [];
  [...state.foods].sort((a, b) => b.ts - a.ts).forEach(f => { const k = f.name.trim().toLowerCase(); if (!seen.has(k) && recents.length < 12) { seen.add(k); recents.push(f); } });
  state.recents = recents;
  const kp = t.p * 4, kc = t.c * 4, kf = t.f * 9, ks = kp + kc + kf;
  const sp = v => ks ? (v / ks * 100).toFixed(1) : 0;
  return '<div class="top"><button class="iconbtn" data-act="dayPrev" aria-label="Previous day">' + ic(I.left) + '</button>' +
    '<div style="text-align:center"><h1>' + esc(dateLabel) + '</h1>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>' +
    '<button class="iconbtn" data-act="dayNext" aria-label="Next day"' + (isToday ? ' disabled' : '') + '>' + ic(I.right) + '</button></div>' +
    '<div class="stack">' +
    '<section class="card hero"><div class="row between"><span class="label">Protein</span><span class="pill num">' + pct + '% of goal</span></div>' +
    '<div class="hero-num"><span class="big num">' + fmt(t.p) + '</span><span class="of num">/ ' + fmt(pg) + ' g</span></div>' +
    '<div class="meter' + (t.p >= pg ? ' done' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="' + pg + '" aria-valuenow="' + Math.round(t.p) + '"><i style="width:' + Math.min(100, t.p / pg * 100) + '%"></i></div>' +
    '<div class="row between small num" style="margin-top:10px"><b style="color:' + (left > 0 ? 'var(--fg)' : 'var(--good)') + '">' + (left > 0 ? left + ' g to go' : 'Goal hit' + (left < 0 ? ' · +' + (-left) + ' g' : '')) + '</b><span class="muted">' + list.length + (list.length === 1 ? ' entry' : ' entries') + '</span></div></section>' +
    '<section class="card stack tight"><div class="row between"><span class="label">Calories</span><span class="num"><b style="font-size:20px">' + fmt(t.cal) + '</b> <span class="muted">/ ' + fmt(S.calGoal) + ' kcal</span></span></div>' +
    '<div class="bar"><i style="width:' + Math.min(100, t.cal / S.calGoal * 100) + '%"></i></div>' +
    '<div class="tiles" style="margin-top:6px"><div class="tile"><div class="label"><span class="dot" style="background:var(--carb)"></span>Carbs</div><div class="v num">' + fmt(t.c) + '<small>g</small></div></div>' +
    '<div class="tile"><div class="label"><span class="dot" style="background:var(--fat)"></span>Fat</div><div class="v num">' + fmt(t.f) + '<small>g</small></div></div></div>' +
    (ks ? '<div class="split" style="margin-top:8px" aria-label="Calorie split"><i style="width:' + sp(kp) + '%;background:var(--accent)"></i><i style="width:' + sp(kc) + '%;background:var(--carb)"></i><i style="width:' + sp(kf) + '%;background:var(--fat)"></i></div>' +
      '<div class="legend num"><span><span class="dot" style="background:var(--accent)"></span>Protein ' + Math.round(kp / ks * 100) + '%</span><span><span class="dot" style="background:var(--carb)"></span>Carbs ' + Math.round(kc / ks * 100) + '%</span><span><span class="dot" style="background:var(--fat)"></span>Fat ' + Math.round(kf / ks * 100) + '%</span></div>' : '') +
    '</section>' +
    '<button class="btn primary" data-act="openAdd">' + ic(I.plus) + ' Log food</button>' +
    (recents.length ? '<div class="stack tight"><div class="label">Quick add</div><div class="chips">' +
      recents.map((f, i) => '<button class="chip" data-act="quick" data-i="' + i + '"><b>' + esc(f.name) + '</b><span class="num"><em>' + fmt(f.p) + ' g</em> · ' + fmt(f.cal) + ' kcal</span></button>').join('') + '</div></div>' : '') +
    '<section class="card" style="padding:10px 14px"><div class="label" style="padding:8px 2px 4px">' + (isToday ? 'Today' : 'This day') + '</div>' +
    (list.length ? list.map(f => '<button class="entry" data-act="editFood" data-id="' + f.id + '">' +
      (f.thumb ? '<img class="avatar" src="' + f.thumb + '" alt="">' : '<div class="avatar">' + esc((f.name.trim()[0] || '?').toUpperCase()) + '</div>') +
      '<div class="grow"><div class="t">' + (f.ai ? ic(I.spark, 'aitag') : '') + esc(f.name) + '</div><div class="m num">' + timeOf(f.ts) + ' · ' + fmt(f.cal) + ' kcal · ' + fmt(f.c) + 'c ' + fmt(f.f) + 'f</div></div>' +
      '<div class="p num">' + fmt(f.p) + '<small>g</small></div></button>').join('')
      : '<p class="muted" style="padding:6px 2px 14px;margin:0">Nothing logged yet. Tap “Log food”, then snap a photo or type what you ate.</p>') + '</section>' +
    '<section class="card"><div class="row between" style="margin-bottom:6px"><span class="label">Protein, 7 days</span>' + weekAvg() + '</div>' + proteinChart() + '</section>' +
    '</div>';
}
function weekDays() { const end = todayKey(), out = []; for (let i = 6; i >= 0; i--) { const k = addDays(end, -i); out.push({ k, p: totalsFor(k).p, wd: 'SMTWTFS'[parseKey(k).getDay()] }); } return out; }
function weekAvg() { const d = weekDays(), a = d.reduce((x, y) => x + y.p, 0) / 7; return '<span class="pill num">avg ' + Math.round(a) + ' g</span>'; }
function proteinChart() {
  const end = todayKey(), goal = state.settings.proteinGoal, days = weekDays();
  const W = 340, H = 170, L = 8, R = 8, T = 22, B = 24, pw = W - L - R, ph = H - T - B;
  const max = Math.max(goal, ...days.map(d => d.p)) * 1.12;
  const y = v => T + ph - v / max * ph, bw = pw / 7;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Protein per day for the last 7 days"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface3)"/><stop offset="1" style="stop-color:var(--surface2)"/></linearGradient></defs><line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '"/>';
  days.forEach((d, i) => {

    s += '<rect x="' + x + '" y="' + (T + ph - h) + '" width="' + w + '" height="' + h + '" rx="6" fill="url(#' + (hit ? 'bg1' : 'bg2') + ')"/>';
    if (d.p > 0) s += '<text class="val" x="' + (x + w / 2) + '" y="' + (T + ph - h - 5) + '" text-anchor="middle">' + Math.round(d.p) + '</text>';
    s += '<text x="' + (x + w / 2) + '" y="' + (H - 7) + '" text-anchor="middle"' + (d.k === end ? ' style="fill:var(--accent);font-weight:700"' : '') + '>' + d.wd + '</text>';
  });
  s += '<line class="goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(goal) + '" y2="' + y(goal) + '"/><text x="' + (W - R) + '" y="' + (y(goal) - 5) + '" text-anchor="end">goal ' + goal + ' g</text></svg>';
  return s;
}

/* ---------- Food: Claude estimate, reasoning and refinement ---------- */
const SCHEMA = '{"name":"string, max 60 chars","portion":"string, the whole portion in plain words","items":[{"name":"string","portion":"string","calories":0,"protein_g":0,"carbs_g":0,"fat_g":0}],"reasoning":"2-4 plain sentences: what you identified, how you judged the portion size, and what drives the calories and protein","assumptions":["short strings such as: eggs cooked in 1 tsp oil"],"confidence":"low|medium|high","confidence_note":"one short sentence on what would change this estimate the most"}';

const RULES = 'List every distinct food as an item (at most 8). Calories are whole kcal; grams are whole numbers. The item values are the source of truth and the totals are their sum, so do not include totals. Use realistic typical portions. If the input is not food, use one item named "Not food" with zeros.\n';

const ERR = {
  not_granted: 'Claude access was declined for this page. Allow it in the artifact’s permissions, or enter the numbers by hand.',
  sampling_disabled: 'Claude isn’t available for this account. Enter the numbers by hand.',
  rate_limited: 'Too many requests, or your Claude usage limit was reached. Try again in a bit.',
  invalid_json: 'Claude’s reply couldn’t be read. Try again, or add more detail.',
  image_rejected: 'That photo couldn’t be used. Try a different one.',
  images_unavailable: 'Photos aren’t available here. Describe the food in text instead.',

  refused: 'Claude couldn’t estimate that. Try rewording it.',
  empty_completion: 'Claude returned nothing. Try again with more detail.',

const errText = e => ERR[e && e.code] || 'Couldn’t reach Claude. Check your connection and try again, or enter the numbers by hand.';

async function shrink(file, max = 1280, q = .85) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', q));
  } catch (e) { return file; } finally { URL.revokeObjectURL(url); }
}
async function makeThumb(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 360 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .72);
  } catch (e) { return ''; } finally { URL.revokeObjectURL(url); }
}
function dataUrlToBlob(u) {

}

function parseEstimate(o) {
  if (Array.isArray(o)) o = o[0];
  if (!o || typeof o !== 'object') throw { code: 'invalid_json' };
  const mk = it => ({ name: String(it.name || 'Item').slice(0, 60), portion: String(it.portion || '').slice(0, 80),
    calories: Math.max(0, num(it.calories ?? it.kcal)), protein_g: Math.max(0, num(it.protein_g ?? it.protein)), carbs_g: Math.max(0, num(it.carbs_g ?? it.carbs)), fat_g: Math.max(0, num(it.fat_g ?? it.fat)) });
  let items = (Array.isArray(o.items) ? o.items : []).filter(i => i && typeof i === 'object').slice(0, 10).map(mk);
  if (!items.length) items = [mk(o)];
  items.forEach(i => { i.protein_g = r1(i.protein_g); i.carbs_g = r1(i.carbs_g); i.fat_g = r1(i.fat_g); i.calories = Math.round(i.calories || (i.protein_g * 4 + i.carbs_g * 4 + i.fat_g * 9)); });
  return {
    name: String(o.name || '').trim().slice(0, 60) || items.map(i => i.name).join(', ').slice(0, 60),
    portion: String(o.portion || '').trim(), items, t: sumItems(items),
    reasoning: String(o.reasoning || '').trim(),
    assumptions: (Array.isArray(o.assumptions) ? o.assumptions : []).map(String).filter(Boolean).slice(0, 8),
    conf: ['low', 'medium', 'high'].includes(o.confidence) ? o.confidence : '',

}
function sumItems(items) {
  const t = items.reduce((a, i) => (a.p += i.protein_g, a.cal += i.calories, a.c += i.carbs_g, a.f += i.fat_g, a), { p: 0, cal: 0, c: 0, f: 0 });

}
/* The items as they stand now: base items scaled by the portion multiplier, or one item built from the typed numbers. */
function effectiveItems(c) {

  return src.map(i => ({ ...i, calories: Math.round(i.calories * m), protein_g: r1(i.protein_g * m), carbs_g: r1(i.carbs_g * m), fat_g: r1(i.fat_g * m) }));

const sgn = n => (n > 0 ? '+' : '−') + Math.abs(n);

async function estimate() {
  const a = state.add; captureDraft();
  const text = (a.text || '').trim();
  if (!text && !a.photo) { a.error = 'Add a photo or describe what you ate first.'; render(true); return; }
  if (!state.ai) { a.error = ERR.sampling_disabled; render(true); return; }
  a.error = ''; a.status = 'loading'; render(true);
  const ctl = new AbortController(); state.ctl = ctl;
  const prompt =
    'You are a careful nutrition estimator for a gym-goer who tracks protein first.\n' +
    (a.photo ? 'A photo of the food is attached.\n' : '') +
    (text ? 'The user describes it as: "' + text.replace(/"/g, "'") + '"\n' : '') +
    'Estimate the whole portion shown or described. ' + RULES +
    'Reply with ONLY one JSON object, no prose, no markdown fences, in exactly this shape:\n' + SCHEMA;
  const opts = { signal: ctl.signal, model: 'claude-sonnet-5-5', modelTier: 'default' };
  if (a.photo) opts.images = [a.photo];

    if (state.add !== a) return;
    state.cf = newCf({ name: e.name || text.slice(0, 60) || 'Food', portion: e.portion, p: e.t.p, cal: e.t.cal, c: e.t.c, f: e.t.f,
      base: { ...e.t, items: e.items }, mult: 1, photo: a.photo, thumb,
      ai: { items: e.items, reasoning: e.reasoning, assumptions: e.assumptions, conf: e.conf, confNote: e.confNote, thread: [], text } });

  } catch (e) {

async function followUp() {

/* ---------- Workout actions ---------- */
let audioCtx;

async function startWorkout() {

  const id = await safe(() => db.sessions.add(s)); s.id = id ?? Date.now();

}

    '<section class="card stack tight"><div class="label">Food estimates</div>' +
    (state.ai ? '<div class="note">Connected. Estimates and refinements run through your own Claude account when you tap Estimate. No API key needed.' + (state.aiImages === false ? ' Photo input isn’t available in this view, so use text.' : '') + '</div>'
      : '<div class="note">' + (state.aiReady ? 'Claude isn’t available in this view, so estimates are off. Manual entry still works.' : 'Checking…') + '</div>') + '</section>' +
    '<section class="card stack tight"><div class="label">Storage</div><div class="note">' +
    (store === 'cloud' ? 'Saved to your Claude account, private to you. Your meals and workouts show up on any device where you open this page.'
      : store === 'local' ? 'Saved in this browser only. Account saving isn’t available in this view, and browser storage can be cleared, so copy a backup below.'
      : 'Storage is blocked here, so data lasts only until you close this page. Copy a backup below.') + '</div></section>' +
    '<section class="card stack tight"><div class="label">Backup</div><p class="small muted" style="margin:0">Copy everything as text to keep a spare, or paste one back to restore.</p>' +
    '<textarea id="bk" class="in" style="font-size:13px;min-height:90px" placeholder="Backup JSON appears here. Paste one here to restore.">' + esc(state.backupMsg) + '</textarea>' +
    '<div class="grid2"><button class="btn sm" data-act="exportBk">Copy backup</button><button class="btn sm' + (state.arm === 'restore' ? ' armed' : '') + '" data-act="restoreBk">' + (state.arm === 'restore' ? 'Tap to replace data' : 'Restore') + '</button></div>' +
    '<button class="btn danger sm' + (state.arm === 'wipe' ? ' armed' : '') + '" data-act="wipe">' + (state.arm === 'wipe' ? 'Tap again to erase everything' : 'Erase all data') + '</button></section></div>';
}

/* ============================================================
   Events
   ============================================================ */
function armed(key) {
  if (state.arm === key) { state.arm = null; return true; }
  state.arm = key; render(); clearTimeout(armed.t); armed.t = setTimeout(() => { if (state.arm === key) { state.arm = null; render(); } }, 3500);
  return false;
}
const newCf = o => ({ morePhotos: [], fu: '', showWhy: false, photo: null, thumb: '', ai: null, ...o });
function openCf(c) { state.cf = c; state.sheet = 'confirm'; state.pop = true; render(); }
function addFoodEntry(f) {
  f.date = state.viewDate; f.ts = Date.now();
  return safe(async () => { f.id = await db.foods.add(f); }).then(() => { if (f.id == null) f.id = Date.now() + Math.random(); state.foods.push(f); });
}

const ACT = {
  nav(el) { state.tab = el.dataset.tab; state.arm = null; state.enter = true; render(); window.scrollTo(0, 0); },
  dayPrev() { state.viewDate = addDays(state.viewDate, -1); render(); },
  dayNext() { if (state.viewDate < todayKey()) { state.viewDate = addDays(state.viewDate, 1); render(); } },
  openAdd() { state.add = { text: '', photo: null, photoUrl: '', status: 'idle', error: '' }; state.sheet = 'add'; state.pop = true; render(); },
  closeSheet() { if (state.ctl) state.ctl.abort(); if (state.add && state.add.photoUrl) URL.revokeObjectURL(state.add.photoUrl); state.sheet = null; state.add = null; state.cf = null; state.arm = null; render(true); },
  scrim(el, ev) { if (ev.target === el) ACT.closeSheet(); },
  clearPhoto() { captureDraft(); URL.revokeObjectURL(state.add.photoUrl); state.add.photo = null; state.add.photoUrl = ''; render(true); },
  cancelEst() { if (state.ctl) state.ctl.abort(); },
  estimate() { estimate(); },
  manual() { captureDraft(); openCf(newCf({ name: (state.add && state.add.text || '').slice(0, 60), portion: '', p: 0, cal: 0, c: 0, f: 0, base: null, mult: 1 })); },
  scale(el) {
    captureDraft();
    const c = state.cf, m = parseFloat(el.dataset.m); if (!c.base) return;
    c.mult = m; c.p = r1(c.base.p * m); c.cal = Math.round(c.base.cal * m); c.c = r1(c.base.c * m); c.f = r1(c.base.f * m);
    render(true);
  },
  toggleWhy() { captureDraft(); state.cf.showWhy = !state.cf.showWhy; render(true); },
  fuChip(el) { captureDraft(); state.cf.fu = el.dataset.s; render(true); const t = $('#fuText'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } },
  followUp() { followUp(); },
  fuClearPhotos() { captureDraft(); state.cf.morePhotos = []; render(true); },
  async saveFood() {
    captureDraft(); const c = state.cf; if (!c.name) c.name = 'Food';
    const ai = c.ai ? { ...c.ai, items: effectiveItems(c) } : null;
    const rec = { name: c.name, portion: c.portion, p: c.p, cal: c.cal, c: c.c, f: c.f, thumb: c.thumb || '', ai };
    if (c.id != null) {
      const i = state.foods.findIndex(f => f.id === c.id), nf = { ...state.foods[i], ...rec };
      state.foods[i] = nf; await safe(() => db.foods.put(nf));
    } else { await addFoodEntry(rec); }
    ACT.closeSheet(); toast('Saved');
  },
  editFood(el) {
    const f = state.foods.find(x => String(x.id) === el.dataset.id); if (!f) return;
    openCf(newCf({ id: f.id, name: f.name, portion: f.portion || '', p: f.p, cal: f.cal, c: f.c, f: f.f, thumb: f.thumb || '',
      ai: f.ai ? JSON.parse(JSON.stringify(f.ai)) : null, base: { p: f.p, cal: f.cal, c: f.c, f: f.f, items: f.ai ? f.ai.items : [] }, mult: 1 }));
  },
  async delFood() {
    if (!armed('delFood')) return;
    const id = state.cf.id, f = state.foods.find(x => x.id === id);
    state.foods = state.foods.filter(x => x.id !== id); await safe(() => db.foods.delete(id));
    ACT.closeSheet();
    toast('Entry deleted', async () => { state.foods.push(f); await safe(() => db.foods.put(f)); render(); });
  },
  async quick(el) {
    const r = state.recents[+el.dataset.i]; if (!r) return;
    const f = { name: r.name, portion: r.portion, p: r.p, cal: r.cal, c: r.c, f: r.f, thumb: r.thumb || '', ai: r.ai ? JSON.parse(JSON.stringify(r.ai)) : null };
    await addFoodEntry(f); render();
    toast('Added ' + r.name, async () => { state.foods = state.foods.filter(x => x !== f); await safe(() => db.foods.delete(f.id)); render(); });
  },
  undo() { const u = toast.undo; $('#toast').classList.remove('show'); toast.undo = null; u && u(); },

  startWk() { startWorkout(); },
  adj(el) {
    const wk = ensureWk(), id = el.dataset.ex, f = el.dataset.f, d = +el.dataset.d;
    const v = wk.input[id]; v[f] = f === 'w' ? Math.max(0, r1(v[f] + d * state.settings.step)) : Math.max(0, Math.round(v[f] + d));
    const inp = document.querySelector('[data-in="' + id + '.' + f + '"]'); if (inp) inp.value = f === 'w' ? wfmt(v[f]) : v[f];
  },
  logSet() { logSet(); },
  skipSS() { const s = state.active; s.cur = { ss: s.cur.ss + 1, set: 1, target: state.settings.sets }; state.wk = null; state.enter = true; persistActive(); render(); },
  undoSet() {
    const s = state.active, l = s.logs.pop(); if (!l) return;
    s.cur = { ss: ssIndex(l.ss), set: l.set, target: Math.max(s.cur.target, l.set) };
    s.restStart = null; state.wk = null; state.enter = true; persistActive(); render(); toast('Last set removed');
  },
  restDone() { restDone(); },
  moreSet() { const s = state.active; s.cur.target = s.cur.set + 1; restDone(); },
  skipRest() { const s = state.active; s.cur.target = s.cur.set; restDone(); },
  finishWk() { if (armed('finish')) finishWorkout(); },
  hTab(el) { state.hTab = el.dataset.t; render(); },
  toggleSess(el) { const id = +el.dataset.id; state.openSess = state.openSess === id ? null : id; render(); },
  async delSess(el) {
    if (!armed('delS' + el.dataset.id)) return;
    const id = +el.dataset.id; state.sessions = state.sessions.filter(s => s.id !== id); state.openSess = null;
    await safe(() => db.sessions.delete(id)); render(); toast('Workout deleted');
  },

  async exportBk() {
    const data = JSON.stringify({ v: 1, foods: state.foods, sessions: state.sessions.filter(s => s.status === 'done'), settings: state.settings });
    state.backupMsg = data;
    try { await navigator.clipboard.writeText(data); toast('Backup copied'); } catch (e) { toast('Select the text below and copy it'); }
    render(); const t = $('#bk'); if (t) { t.focus(); t.select(); }
  },
  async restoreBk() {
    const t = $('#bk'); let o;
    try { o = JSON.parse(t.value); if (!o || !Array.isArray(o.foods) || !Array.isArray(o.sessions)) throw 0; } catch (e) { toast('Paste a backup into the box first'); return; }
    if (!armed('restore')) return;
    await safe(async () => {
      await db.foods.clear(); await db.sessions.clear();
      for (const f of o.foods) await db.foods.put(f);
      for (const s of o.sessions) await db.sessions.put(s);
      for (const [k, v] of Object.entries(o.settings || {})) if (k in DEFAULTS) await db.settings.put({ key: k, value: v });
    });
    await loadAll(); state.backupMsg = ''; render(); toast('Backup restored');
  },
  async wipe() {
    if (!armed('wipe')) return;
    await safe(async () => { await db.foods.clear(); await db.sessions.clear(); await db.settings.clear(); });
    state.foods = []; state.sessions = []; state.active = null; state.wk = null; state.settings = { ...DEFAULTS }; render(); toast('All data erased');
  },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.in) {
    const [id, f] = el.dataset.in.split('.'), wk = ensureWk();
    wk.input[id][f] = f === 'w' ? Math.max(0, num(el.value)) : Math.max(0, Math.round(num(el.value)));
  }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.dataset.set) {
    const k = el.dataset.set; let v = num(el.value, DEFAULTS[k]);
    if (k === 'sets') v = Math.min(10, Math.max(1, Math.round(v)));
    else if (k === 'restSec') v = Math.min(600, Math.max(10, Math.round(v)));
    else if (k === 'step') v = v || 5; else v = Math.max(1, Math.round(v));
    await setSetting(k, v); el.value = v; toast('Saved');
  } else if (el.dataset.ch === 'hEx') { state.hEx = el.value; render(); }
  else if (el.dataset.ch === 'photo' && el.files && el.files[0]) {
    captureDraft(); const a = state.add;
    if (a.photoUrl) URL.revokeObjectURL(a.photoUrl);
    a.photo = await shrink(el.files[0]); a.photoUrl = URL.createObjectURL(a.photo); a.error = ''; render(true);
  } else if (el.dataset.ch === 'fuPhoto' && el.files && el.files[0] && state.cf) {
    captureDraft(); const c = state.cf;
    c.morePhotos = [...c.morePhotos, await shrink(el.files[0])].slice(-Math.max(1, state.aiMax)); c.fuErr = ''; render(true);
  }
});

/* Rest timer: patches only the clock, ring and header so inputs are never re-rendered. */
setInterval(() => {
  const s = state.active; if (!s) return;
  const el = $('#wkElapsed'); if (el) el.textContent = mmss((Date.now() - s.ts) / 1000);
  if (!s.restStart) return;
  const e = (Date.now() - s.restStart) / 1000, target = state.settings.restSec, C = 2 * Math.PI * 100;
  const clk = $('#restClock'); if (clk) clk.textContent = mmss(e);
  const fg = $('#ringFg'); if (fg) fg.setAttribute('stroke-dashoffset', C * (1 - Math.min(1, e / target)));
  if (e >= target) {
    const ring = $('#ring'); if (ring) ring.classList.add('ready');
    const sub = $('#restSub'); if (sub) sub.textContent = 'Ready when you are';
    if (!state.alerted) { state.alerted = true; beep(); }
  }
}, 250);

/* ---------- Boot ---------- */
(async function boot() {
  render();
  await initDb();
  try { await loadAll(); await migrateLocal(); } catch (e) { toast('Could not read saved data'); }
  state.loading = false;
  if (state.active) { state.tab = 'workout'; keepAwake(); }
  render();
  if (store === 'mem') toast('Storage is blocked here. Data won’t persist.');
  else if (store === 'local') toast('Account saving is unavailable. Saving in this browser only.');
  try {
    const s = window.claude && await window.claude.use('sample');
    state.ai = s || null;
    if (s) { const lim = await s.limits().catch(() => null); state.aiImages = !!(lim && lim.images); state.aiMax = (lim && lim.images && lim.images.maxCount) || 1; }
  } catch (e) { state.ai = null; }
  state.aiReady = true;
  if (state.sheet === 'confirm' || (state.sheet === 'add' && state.add && state.add.status === 'idle')) render(true);
  else if (state.tab === 'settings') render();
})();
</script>
